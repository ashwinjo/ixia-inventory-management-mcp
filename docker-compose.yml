services:
  ixnetwork-mcp-server:
    build: .
    container_name: ixnetwork-inventory-mcp
    ports:
      - "8888:8888"
    volumes:
      # config.json is writable — chassis can be added/removed via MCP tools at runtime
      - ./config.json:/app/config.json
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_SERVER_PORT=8888
      # Required: set via .env file or export MCP_API_KEY=$(openssl rand -hex 32)
      - MCP_API_KEY=${MCP_API_KEY}
      # Optional: external credentials service
      # - CREDENTIALS_SERVICE_URL=http://host.docker.internal:3001/api/config/credentials
      # - CREDENTIALS_SERVICE_TIMEOUT=5
    # Required on Linux to reach services on the host from within the container
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
